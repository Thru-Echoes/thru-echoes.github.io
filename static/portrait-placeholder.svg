<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Portrait placeholder — a real photograph will replace this image">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#f6f1ea"/>
      <stop offset="100%" stop-color="#e7d6c0"/>
    </linearGradient>
    <linearGradient id="fg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#8e5a3a"/>
      <stop offset="100%" stop-color="#6d4528"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- soft halo -->
  <circle cx="400" cy="410" r="230" fill="#f0e4d1" opacity="0.6" filter="url(#soft)"/>

  <!-- stylized silhouette: shoulders + head -->
  <path d="M 200 800 C 200 620, 260 560, 340 540 L 460 540 C 540 560, 600 620, 600 800 Z"
        fill="url(#fg)" opacity="0.88"/>
  <circle cx="400" cy="420" r="130" fill="url(#fg)" opacity="0.92"/>

  <!-- inner accent line -->
  <circle cx="400" cy="420" r="130" fill="none" stroke="#fcfaf7" stroke-width="2" opacity="0.4"/>

  <!-- label -->
  <text x="400" y="780" text-anchor="middle"
        font-family="Source Serif 4, Georgia, serif"
        font-size="18" fill="#8e5a3a" opacity="0.55"
        letter-spacing="4">PORTRAIT · PLACEHOLDER</text>
</svg>
